line-length = 100
target-version = "py312"
extend-exclude = ["__pycache__"]

[lint]
select = ["E", "F", "I", "UP", "W", "B", "C4"]
ignore = ["E501"]  # line-length 由 formatter 管

[lint.per-file-ignores]
"tests/*" = [
    "E402",   # 测试 conftest import 顺序宽松
    "F403",   # 测试用 `from x import *` 简化符号访问（项目测试惯例）
    "F405",   # 与 F403 配套：星号导入的名称可能未定义
    "F821",   # 跳过的过时测试模块引用已删除的符号（test_task_db.py）
]

[lint.isort]
known-first-party = ["jcx"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
