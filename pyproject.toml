[project]
name = "jcx"
version = "0.5.6"
description = "J's Python utility library: Result/Option types, file/time/json/db/net helpers"
readme = "README.md"
authors = [
    { name = "dayn9t", email = "dayn9t@gmail.com" }
]
requires-python = "~=3.12.0"
dependencies = [
    "rustshed",
    "pydantic",
    "typer",
    "arrow",
    "loguru",
    "paho-mqtt",
    "parse",
    "redis",
    "requests",
    "json5",
    "cattrs",
    "flask-restx",
    "rich",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.13.5",
    "pre-commit>=4.5.1",
    "mypy>=1.13",
    "ruff>=0.7",
    "pytest",
    "pytest-cov>=7.1.0",
]

[project.scripts]
cx_rename = "jcx.bin.cx_rename:main"
cx_task = "jcx.bin.cx_task:main"
cx_dao = "jcx.bin.cx_dao:main"
mv_re = "jcx.bin.mv_re:main"
rename_re = "jcx.bin.rename_re:main"

[tool.pytest.ini_options]
addopts = "-m 'not integration' --cov=jcx --cov-report=term-missing --cov-report=html"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["jcx"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src/jcx"]

# 非 9 锁定库无 type stub —— per-module 放行 import（缺 stub 的 import 放行，非类型检查放水）
[[tool.mypy.overrides]]
module = [
    "flask_restx",
    "parse",
    "rustshed",
    "arrow",
    "redis",
    "paho.mqtt.*",
    "loguru",
    "json5",
    "cattr",
    "cattrs",
    "requests",
    "requests.*",
]
ignore_missing_imports = true

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

